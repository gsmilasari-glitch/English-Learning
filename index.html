<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hello English!</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap">
<style>
:root{--bg:#fff4d6;--ink:#2b2350;--card:#fff;--mut:#6a6490;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1838;--ink:#f4f0ff;--card:#2b2552;--mut:#b8b0e0}}
:root[data-theme="dark"]{--bg:#1c1838;--ink:#f4f0ff;--card:#2b2552;--mut:#b8b0e0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;font:17px/1.5 "Baloo 2","Trebuchet MS",system-ui,sans-serif;background:var(--bg);color:var(--ink)}
#app{max-width:780px;margin:auto;padding:14px}
h1{margin:6px 0;font-size:28px}
button{font:inherit;cursor:pointer}
.hero{background:linear-gradient(135deg,#ff6b6b,#ffa726,#ffd93d);border-radius:24px;padding:16px;color:#2b2350;display:flex;gap:14px;align-items:center}
.ring{min-width:92px;height:92px;border-radius:50%;background:#fff;display:grid;place-items:center;font-weight:800;font-size:28px;border:6px solid #2b2350}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:14px}
.tc{border:0;border-radius:22px;padding:14px;color:#fff;font-weight:700;text-align:left;min-height:120px;box-shadow:0 5px 0 rgba(0,0,0,.22)}
.tc big{display:block;font-size:34px}.tc small{display:block;opacity:.95}
.card{background:var(--card);border-radius:20px;padding:14px;margin:12px 0;box-shadow:0 3px 0 rgba(0,0,0,.08)}
.tabs{display:flex;gap:8px;margin:10px 0}
.tab{flex:1;border:0;border-radius:14px;padding:10px;font-weight:700;background:var(--card);color:var(--ink)}
.tab.on{color:#fff;background:var(--c)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:6px 0;border-bottom:1px dashed #8884}
.row b{color:var(--c)}.row i{color:var(--mut)}.row span{margin-left:auto;font-size:15px}
.sp{border:0;background:var(--c);color:#fff;border-radius:50%;width:32px;height:32px;flex:none}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--card);border:2px solid var(--c);border-radius:14px;padding:6px 10px;text-align:center;min-width:88px;cursor:pointer}
.chip i{display:block;font-size:13px;color:var(--mut)}.chip b{display:block}
.tip{background:#fff3b0;color:#4a3b00;border-radius:14px;padding:10px;margin:8px 0;font-size:16px}
.o{display:block;width:100%;margin:8px 0;padding:12px;border:3px solid var(--c);border-radius:16px;background:var(--card);color:var(--ink);font-weight:700;font-size:18px}
.o.ok{background:#2ecc71;color:#fff;border-color:#2ecc71}.o.no{background:#ff5252;color:#fff;border-color:#ff5252}
.bar{height:12px;background:#8883;border-radius:9px;overflow:hidden}.bar div{height:100%;background:var(--c);transition:.3s}
.pic{font-size:64px;line-height:1.2;text-align:center}.pic img{width:110px;height:110px;object-fit:cover;border-radius:18px}
.chip .pic{font-size:40px}.chip .pic img{width:70px;height:70px}
.go{border:0;border-radius:16px;padding:10px 20px;background:var(--c);color:#fff;font-weight:800}
.back{background:none;border:0;color:var(--ink);font-weight:700}
input{font:inherit;padding:8px;border-radius:10px;border:2px solid #8886;background:var(--card);color:var(--ink);max-width:100%}
</style></head><body><div id="app"></div>
<script>
const $=s=>document.querySelector(s),A=$("#app");
const st=(k,v)=>{try{if(v===undefined)return JSON.parse(localStorage.getItem(k));localStorage.setItem(k,JSON.stringify(v))}catch(e){return null}};
let best=st("best")||{},imgs=st("imgs")||{};
const sh=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(x=>x[1]),pk=(a,n)=>sh(a).slice(0,n);
const say=t=>{try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="en-US";u.rate=.8;speechSynthesis.speak(u)}catch(e){}};
const art=w=>/^(uni|use|eu)/.test(w)?"a":/^(hour|honest)|^[aeiou]/.test(w)?"an":"a";
const Q=(q,a,pool,n=3)=>{const m=q.match(/<big>(.*?)<\/big>/),k=q.match(/data-s="([^"]*)"/);let s=a;if(m&&/___/.test(m[1]))s=m[1].replace(/<[^>]*>/g,"").replace("___",a);else if(/demek|Türkçesi/.test(q)&&k)s=k[1];return{q,a,s,o:sh([a,...pk(pool.filter(x=>x!==a),n)])}};
const sp=t=>`<button class="sp" data-s="${t}">🔊</button>`;
const R=(en,tr,pr)=>`<div class="row">${sp(en)}<b>${en}</b><i>(${pr})</i><span>${tr}</span></div>`;
const chip=(en,top,pr)=>`<div class="chip" data-s="${en}"><big>${top}</big><b>${en}</b><i>${pr}</i></div>`;
/* kelimeler: [İngilizce, Türkçe, okunuş, emoji] */
const V=[["book","kitap","buk","📖"],["pen","tükenmez kalem","pen","🖊️"],["pencil","kurşun kalem","pensıl","✏️"],["bag","çanta","bäg","🎒"],["ruler","cetvel","rulır","📏"],["chair","sandalye","çer","🪑"],["cat","kedi","kät","🐱"],["dog","köpek","dog","🐶"],["ball","top","bol","⚽"],["apple","elma","äpıl","🍎"],["egg","yumurta","eg","🥚"],["orange","portakal","orınc","🍊"],["umbrella","şemsiye","ambrelı","☂️"],["elephant","fil","elıfınt","🐘"],["ice cream","dondurma","ays krim","🍦"],["car","araba","kar","🚗"],["house","ev","havs","🏠"],["flower","çiçek","flavır","🌸"],["tree","ağaç","tri","🌳"]];
V.splice(0,V.length,["book","kitap","buk","📖"],["notebook","defter","notbuk","📓"],["pencil","kurşun kalem","pensıl","✏️"],["pen","tükenmez kalem","pen","🖊️"],["eraser","silgi","ireysır","🧽"],["sharpener","kalemtıraş","şarpınır","⚙️"],["ruler","cetvel","rulır","📏"],["schoolbag","okul çantası","skulbäg","🎒"],["pencil case","kalem kutusu","pensıl keys","👝"],["crayon","pastel boya","kreyon","🖍️"],["paintbrush","boya fırçası","peyntbraş","🖌️"],["palette","palet","pälıt","🎨"],["globe","küre","glovb","🌍"],["map","harita","mäp","🗺️"],["file","dosya","fayl","📁"],["stapler","zımba","steyplır","🗃️"],["tape","bant","teyp","🩹"],["compass","pergel","kampıs","🧭"],["clock","duvar saati","klok","🕒"],["computer","bilgisayar","kımpyutır","💻"],["projector","projeksiyon","prıcektır","📽️"],["bookcase","kitaplık","bukkeys","📚"],["desk","sıra","desk","🗄️"],["chair","sandalye","çer","🪑"],["table","masa","teybıl","🍽️"],["board","tahta","bord","📋"],["calendar","takvim","kälındır","📅"],["bin","çöp kutusu","bin","🗑️"],["lunchbox","beslenme kutusu","lançboks","🍱"],["camera","fotoğraf makinesi","kämırı","📷"],["kite","uçurtma","kayt","🪁"],["watch","kol saati","voç","⌚"],["phone","telefon","fovn","📱"],["lorry","kamyon","lori","🚚"],["dog","köpek","dog","🐶"],["cat","kedi","kät","🐱"],["ball","top","bol","⚽"]);
const pic=w=>imgs[w]?`<img src="${imgs[w]}" alt="${w}">`:V.find(v=>v[0]==w)[3];
const NW=V.map(v=>v[0]).filter(w=>!["lunchbox","paintbrush","watch"].includes(w));
/* sayılar */
const ones=[["zero","ziro"],["one","van"],["two","tu"],["three","thri"],["four","for"],["five","fayv"],["six","siks"],["seven","sevın"],["eight","eyt"],["nine","nayn"],["ten","ten"],["eleven","ilevın"],["twelve","tuelv"],["thirteen","thör-tin"],["fourteen","for-tin"],["fifteen","fif-tin"],["sixteen","siks-tin"],["seventeen","sevın-tin"],["eighteen","ey-tin"],["nineteen","nayn-tin"]];
const tens=[0,0,["twenty","tuenti"],["thirty","thörti"],["forty","forti"],["fifty","fifti"],["sixty","siksti"],["seventy","sevınti"],["eighty","eyti"],["ninety","nayntı"]];
const nw=n=>{if(n==100)return["one hundred","van handırd"];if(n<20)return ones[n];const t=tens[Math.floor(n/10)],o=n%10;return o?[t[0]+"-"+ones[o][0],t[1]+"-"+ones[o][1]]:t};
/* saat */
const clk=(h,m)=>{const L=(a,l,w,c)=>`<line x1="50" y1="50" x2="${50+l*Math.sin(a*Math.PI/180)}" y2="${50-l*Math.cos(a*Math.PI/180)}" stroke="${c}" stroke-width="${w}" stroke-linecap="round"/>`;return `<svg viewBox="0 0 100 100" width="110"><circle cx="50" cy="50" r="46" fill="#fff" stroke="#ff7043" stroke-width="5"/>${[12,3,6,9].map((n,i)=>`<text x="${[50,84,50,16][i]}" y="${[20,55,89,55][i]}" text-anchor="middle" font-size="13" font-weight="700" fill="#333">${n}</text>`).join("")}${L((h%12)*30+m/2,22,5,"#333")}${L(m*6,34,3,"#e91e63")}</svg>`};
const sayT=(h,m)=>m?`It’s half past ${ones[h][0]}.`:`It’s ${ones[h][0]} o’clock.`;
const FAM=[["mother","anne","madır"],["father","baba","fadır"],["brother","erkek kardeş","bradır"],["sister","kız kardeş","sistır"],["grandmother","büyükanne","grändmadır"],["grandfather","büyükbaba","grändfadır"]];
const QA=[["What’s your name?","My name is Mila."],["How are you?","I’m fine, thank you."],["How old are you?","I’m ten years old."],["Nice to meet you.","Nice to meet you, too."],["Where are you from?","I’m from Turkey."],["Thank you.","You’re welcome."]];
const TR=[["Merhaba!","Hello!"],["Günaydın!","Good morning!"],["Hoşça kal!","Goodbye!"],["İyi geceler!","Good night!"]];
const S=[["Benim adım Mila.","My name is Mila.","may neym iz Mila"],["Ben on yaşındayım.","I’m ten years old.","aym ten yirz old"],["Ben Türkiye’denim.","I’m from Turkey.","aym fram törki"],["Ben öğrenciyim.","I’m a student.","aym ey styudınt"],["Benim bir kız kardeşim var.","I have a sister.","ay häv ey sistır"],["Bu benim annem.","This is my mother.","dis iz may madır"],["Ben kedileri severim.","I like cats.","ay layk käts"],["Ben bir evde yaşıyorum.","I live in a house.","ay liv in ey havs"]];
const em=w=>V.find(v=>v[0]==w)[3];

const T=[
{id:"be",e:"🧩",t:"am / is / are",c:"#ef5350",
l:()=>`<div class=card><div class=tip>💡 <b>am / is / are</b> = “olmak” yardımcı fiilleri. “I” → <b>am</b>, tek kişi/şey → <b>is</b>, birden çok → <b>are</b>.</div>${[["I am","Ben (-im)","ay äm"],["You are","Sen (-sin)","yu ar"],["He is","O (erkek)","hi iz"],["She is","O (kız/kadın)","şi iz"],["It is","O (eşya/hayvan)","it iz"],["We are","Biz (-iz)","vi ar"],["You are","Siz (-siniz)","yu ar"],["They are","Onlar (-ler)","dey ar"]].map(x=>R(...x)).join("")}</div><div class=card><b>Örnekler</b>${R("I am Mila.","Ben Mila’yım.","ay äm Mila")}${R("She is happy.","O mutlu.","şi iz häpi")}${R("They are friends.","Onlar arkadaş.","dey ar frends")}<div class=tip>Kısaltmalar: I’m (aym) · He’s (hiz) · They’re (deyr)</div></div>`,
q:()=>{const L=[["I","am"],["You","are"],["He","is"],["She","is"],["It","is"],["We","are"],["They","are"],["Mila","is"],["Ali and Ece","are"],["The cat","is"],["My friends","are"]],P=["happy","here","at school","ready"];return pk(L,10).map(([s,v],i)=>Q(`<big>${s} ___ ${P[i%4]}.</big>`,v,["am","is","are"],2))}},
{id:"num",e:"🔢",t:"Sayılar 1-100",c:"#fb8c00",
l:()=>`<div class=card><b>0 – 19</b> (tıkla, dinle)<div class=chips>${ones.map((o,n)=>chip(o[0],n,o[1])).join("")}</div></div><div class=card><b>Onluklar</b><div class=chips>${[20,30,40,50,60,70,80,90,100].map(n=>chip(nw(n)[0],n,nw(n)[1])).join("")}</div><div class=tip>Önce onluk, sonra birlik: 21 = twenty-one, 45 = forty-five.<br>⚠️ thirteen (thör-<b>TİN</b>, sonu uzun) ≠ thirty (<b>THÖR</b>-ti, sonu kısa)<br>th = dilin ucu dişlerin arasında</div>${[27,64,99].map(n=>R(nw(n)[0],n,nw(n)[1])).join("")}</div>`,
q:()=>Array.from({length:10},(_,i)=>{const n=1+Math.floor(Math.random()*100),near=[n+1,n-1,n+10,n-10,n+2,n-2].filter(x=>x>0&&x<=100);if(i<5)return Q(`<div class=pic>${n}</div>İngilizcesi hangisi?`,nw(n)[0],near.map(x=>nw(x)[0]));return Q(`${sp(nw(n)[0])} <b>${nw(n)[0]}</b><br>Hangi sayı?`,String(n),near.map(String))})},
{id:"this",e:"👉",t:"this / that / these / those",c:"#7cb342",
l:()=>`<div class=card><div class=tip>👉 <b>This / These</b> = yakındakiler · 🔭 <b>That / Those</b> = uzaktakiler<br>Tek: this, that · Çoğul: these, those</div>${[["This","Bu (yakın, tek)","dis"],["That","Şu / O (uzak, tek)","dät"],["These","Bunlar (yakın, çoğul)","diiz"],["Those","Şunlar (uzak, çoğul)","dovz"]].map(x=>R(...x)).join("")}</div><div class=card>${R("This is a pen.","Bu bir kalem.","dis iz ey pen")}${R("That is a cat.","Şu bir kedi.","dät iz ey kät")}${R("These are pens.","Bunlar kalemler.","diiz ar penz")}${R("Those are cats.","Şunlar kediler.","dovz ar käts")}<div class=tip>Çoğulda: is → are, a/an düşer, isme -s gelir.</div></div>`,
q:()=>Array.from({length:10},()=>{const w=pk(NW,1)[0],near=Math.random()<.5,pl=Math.random()<.5,a=near?(pl?"These":"This"):(pl?"Those":"That");return Q(`<div class=pic>${pl?em(w).repeat(3):em(w)}</div><span class=tip>${near?"📍 Yakında":"🔭 Uzakta"} · ${pl?"birden çok":"tek"}</span><br><big>___ ${pl?"are "+w+"s":"is "+art(w)+" "+w}.</big>`,a,["This","That","These","Those"])})},
{id:"time",e:"⏰",t:"Saatler",c:"#26a69a",
l:()=>`<div class=card><div class=tip>⏰ <b>o’clock</b> = tam saat · <b>half past</b> = buçuk</div>${R("What time is it?","Saat kaç?","vat taym iz it")}<div class=chips style="justify-content:space-around;margin-top:8px">${[[3,0],[3,30],[7,0],[7,30]].map(([h,m])=>`<div class=chip data-s="${sayT(h,m)}">${clk(h,m)}<b>${h}:${m||"00"}</b><b>${m?"half past "+ones[h][0]:ones[h][0]+" o’clock"}</b><i>${m?"haf päst ":""}${ones[h][1]}${m?"":" ıklok"}</i></div>`).join("")}</div>${R("It’s three o’clock.","Saat 3.","its thri ıklok")}${R("It’s half past three.","Saat 3 buçuk.","its haf päst thri")}</div>`,
q:()=>Array.from({length:10},()=>{const h=1+Math.floor(Math.random()*12),m=Math.random()<.5?0:30,alt=[[h,m?0:30],[h%12+1,m],[(h+10)%12+1,m],[h%12+1,m?0:30]];return Q(`<div class=pic>${Math.random()<.5?h+":"+(m?"30":"00"):clk(h,m)}</div>Saat kaç?`,sayT(h,m),alt.map(x=>sayT(...x)))})},
{id:"meet",e:"👋",t:"Tanışma",c:"#42a5f5",
l:()=>`<div class=card>${[["Hello! / Hi!","Merhaba!","helo / hay"],["Good morning!","Günaydın!","gud morning"],["Good afternoon!","İyi günler!","gud afdırnun"],["Good night!","İyi geceler!","gud nayt"],["What’s your name?","Adın ne?","vots yor neym"],["My name is Mila.","Benim adım Mila.","may neym iz Mila"],["How are you?","Nasılsın?","hav ar yu"],["I’m fine, thank you.","İyiyim, teşekkürler.","aym fayn, thenk yu"],["How old are you?","Kaç yaşındasın?","hav old ar yu"],["I’m ten years old.","On yaşındayım.","aym ten yirz old"],["Where are you from?","Nerelisin?","ver ar yu fram"],["I’m from Turkey.","Türkiye’denim.","aym fram törki"],["Nice to meet you.","Tanıştığımıza memnun oldum.","nays tu mit yu"],["Goodbye! / See you!","Hoşça kal! / Görüşürüz!","gudbay / si yu"]].map(x=>R(...x)).join("")}</div>`,
q:()=>[...pk(QA,6).map(([q,a])=>Q(`${sp(q)} “${q}”<br>Cevap hangisi?`,a,QA.map(x=>x[1]))),...pk(TR,4).map(([tr,en])=>Q(`“${tr}” İngilizcesi?`,en,TR.map(x=>x[1])))]},
{id:"an",e:"🍎",t:"a / an",c:"#7e57c2",
l:()=>`<div class=card><div class=tip>🔤 Sesli harfle (a, e, i, o, u) başlayan kelime → <b>an</b><br>Diğer harflerle başlayan kelime → <b>a</b></div>${V.map(v=>R(art(v[0])+" "+v[0],"bir "+v[1],(art(v[0])=="a"?"ey ":"en ")+v[2])).join("")}</div>`,
q:()=>pk(V,10).map(v=>Q(`<div class=pic>${pic(v[0])}</div><big>___ ${v[0]}</big>`,art(v[0]),["a","an"],1))},
{id:"what",e:"❓",t:"What’s this?",c:"#ec407a",
l:()=>`<div class=card><b>Soru–cevap kalıbı</b>${R("What’s this?","Bu nedir?","votsdis")}${R("It’s a book.","Bu bir kitap.","its ey buk")}${R("It’s an eraser.","Bu bir silgi.","its en ireysır")}<div class=tip>What’s = What is · It’s = It is · a/an kuralını unutma!</div></div><div class=card><b>Kelimeler</b> (tıkla, dinle)<div class=chips>${V.map(v=>chip(v[0],`<span class=pic>${pic(v[0])}</span>`,v[2]+" · "+v[1])).join("")}</div><p><button class=go data-a="pics">🖼️ Kendi resimlerimi yükle</button></p></div>`,
q:()=>pk(V,10).map(v=>Q(`<div class=pic>${pic(v[0])}</div><big>What is this?</big>`,`It’s ${art(v[0])} ${v[0]}.`,V.map(x=>`It’s ${art(x[0])} ${x[0]}.`)))},
{id:"fam",e:"👨‍👩‍👧",t:"Ailem",c:"#ff7043",
l:()=>`<div class=card><div class=pic>👩 👨<br>👧 👦</div><p style="text-align:center">Amy ve Tom (parents) → Lina ve Ben</p>${[...FAM,["parents","anne-baba","perınts"]].map(x=>R(x[0],x[1],x[2])).join("")}</div><div class=card>${R("This is my mother.","Bu benim annem.","dis iz may madır")}${R("Amy is Lina’s mother.","Amy, Lina’nın annesi.","Eymi iz Layna’z madır")}${R("Tom is Lina’s father.","Tom, Lina’nın babası.","Tom iz Layna’z fadır")}${R("Ben is Lina’s brother.","Ben, Lina’nın erkek kardeşi.","Ben iz Layna’z bradır")}<div class=tip>’s = “-nın/-nin” (sahiplik): Lina’s mother = Lina’nın annesi</div></div>`,
q:()=>[...["Amy:mother","Tom:father","Ben:brother","Sara:sister","Nora:grandmother","Sam:grandfather"].map(s=>{const[n,r]=s.split(":");return Q(`<div class=pic>👨‍👩‍👧‍👦</div><big>${n} is Lina’s ___.</big>`,r,FAM.map(x=>x[0]))}),...pk(FAM,4).map(([en,tr])=>Q(`“${tr}” İngilizcesi?`,en,FAM.map(x=>x[0])))]},
{id:"me",e:"🌟",t:"Kendimi tanıtıyorum",c:"#5c6bc0",
l:()=>`<div class=card>${R("Hello! Nice to meet you!","Merhaba! Tanıştığımıza memnun oldum!","helo! nays tu mit yu")}${S.map(x=>R(x[1],x[0],x[2])).join("")}</div><div class=card><b>✍️ Sen de kendini tanıt!</b><br><input id=bn placeholder="Adın" size=10> <input id=ba placeholder="Yaşın" size=4> <input id=bc placeholder="Ülken" size=10><p><button class=go data-a="mk">Cümleleri oluştur</button></p><div id=bo></div></div>`,
q:()=>[...pk(S,8).map(([tr,en])=>Q(`“${tr}”<br>İngilizcesi hangisi?`,en,S.map(x=>x[1]))),...pk(S,2).map(([tr,en])=>Q(`${sp(en)} “${en}”<br>Ne demek?`,tr,S.map(x=>x[0])))]}

function mic(i){const SR=window.SpeechRecognition||window.webkitSpeechRecognition,el=$("#r"+i);if(!SR){el.textContent="⚠️ Bu tarayıcıda konuşma tanıma yok. Chrome veya Safari dene.";return}const r=new SR();r.lang="en-US";r.maxAlternatives=3;r.continuous=SPK[i][0].length>60;let b=0,x="";el.textContent="🎙️ Dinliyorum… söyle!";r.onresult=e=>{if(r.continuous){x=[...e.results].map(a=>a[0].transcript).join(" ");b=acc(SPK[i][0],x)}else for(const a of e.results[0]){const p=acc(SPK[i][0],a.transcript);if(p>=b){b=p;x=a.transcript}}};r.onerror=()=>{el.textContent="⚠️ Ses alınamadı ya da mikrofon izni yok."};r.onend=()=>{if(!x){if(el.textContent.startsWith("🎙️"))el.textContent="Ses duyulmadı, tekrar dene.";return}if(b>(spk[i]||0)){spk[i]=b;st("spk",spk);best.spk=Math.round(SPK.reduce((s,_,k)=>s+(spk[k]||0),0)/SPK.length);st("best",best)}el.innerHTML=`${b>=90?"🏆":b>=70?"👏":"💪"} <b>%${b}</b> — duyduğum: “${x.replace(/[<>]/g,"")}”`};r.start();if(r.continuous)setTimeout(()=>{try{r.stop()}catch(e){}},30000)}
function topic(i,m="l"){cur=i;const t=T[i];A.innerHTML=`<div style="--c:${t.c}"><button class=back data-a="home">← Ana sayfa</button><h1>${t.e} ${t.t}</h1><div class=tabs><button class="tab ${m=="l"?"on":""}" data-a="tabl">📖 Konu Anlatımı</button><button class="tab ${m=="q"?"on":""}" data-a="tabq">${t.speak?"🎤 Konuşma":"✏️ Alıştırma"}</button></div><div id=bd></div></div>`;if(m=="l")$("#bd").innerHTML=t.l();else if(t.speak)spkUI();else{let r=[],g=0;while(r.length<NQ&&g++<40)for(const x of t.q())if(!r.some(y=>y.q==x.q))r.push(x);qs=sh(r).slice(0,NQ);qi=0;sc=0;show()}scrollTo(0,0)}
function show(){done=0;const q=qs[qi],N=qs.length;$("#bd").innerHTML=`<div class=bar><div style="width:${qi*100/N}%"></div></div><div class=card>Soru ${qi+1}/${N} · Puan: ${Math.round(sc*100/N)}<div style="text-align:center;margin:8px 0">${q.q}</div>${q.o.map((o,j)=>`<button class=o data-a="ans:${j}">${o}</button>`).join("")}<div id=fb></div></div>`}
function ans(j){if(done)return;done=1;const q=qs[qi],ok=q.o[j]==q.a;if(ok)sc++;document.querySelectorAll(".o").forEach((x,k)=>{if(q.o[k]==q.a)x.classList.add("ok");else if(k==j)x.classList.add("no")});$("#fb").innerHTML=`<p>${ok?"🎉 Harika!":"😮 Doğrusu: <b>"+q.a+"</b>"}${q.s&&q.s!=q.a?`<br>🔊 <i>${q.s}</i>`:""}</p><button class=go data-a="next">${qi==qs.length-1?"Sonucu gör":"Devam →"}</button>`;if(q.s)say(q.s)}
function fin(){const s=Math.round(sc*100/qs.length),id=T[cur].id;if(s>(best[id]||0)){best[id]=s;st("best",best)}$("#bd").innerHTML=`<div class=card style="text-align:center"><div class=pic>${s==100?"🏆🎉🎊":s>=70?"👏":"💪"}</div><h2>${s} / 100</h2><p>${s==100?"Mükemmel! Bu konudan 100 aldın!":s>=70?"Çok iyi! 100 için bir tur daha dene.":"Konu anlatımına bir göz at, sonra tekrar dene."}</p><button class=go data-a="tabq">Tekrar dene</button> <button class=go data-a="tabl" style="background:#888">Konuya dön</button> <button class=go data-a="home" style="background:#555">Ana sayfa</button></div>`}
const act={mic:v=>mic(+v),spk:()=>topic(T.findIndex(t=>t.id=="spk"),"q"),home,topic:v=>topic(+v),tabl:()=>topic(cur,"l"),tabq:()=>topic(cur,"q"),pics,mk,ans:v=>ans(+v),next:()=>{qi++;qi<qs.length?show():fin()},del:w=>{delete imgs[w];st("imgs",imgs);pics()}};
document.addEventListener("click",e=>{const s=e.target.closest("[data-s]");if(s)say(s.dataset.s);const a=e.target.closest("[data-a]");if(a){const i=a.dataset.a.indexOf(":");act[i<0?a.dataset.a:a.dataset.a.slice(0,i)](i<0?undefined:a.dataset.a.slice(i+1))}});
document.addEventListener("change",e=>{const f=e.target.files&&e.target.files[0],w=e.target.dataset.w;if(!f||!w)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement("canvas"),k=Math.min(1,220/Math.max(im.width,im.height));c.width=im.width*k;c.height=im.height*k;c.getContext("2d").drawImage(im,0,0,c.width,c.height);imgs[w]=c.toDataURL("image/jpeg",.8);st("imgs",imgs);pics()};im.src=r.result};r.readAsDataURL(f)});
home();
</script></body></html>
